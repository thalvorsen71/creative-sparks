<style>
/* Layout: a copy editor's desk. One column of galley slips, a sticky tally bar, blue pencil for rewrites, redline for cuts. */
:root {
  --paper: #FAFAF7; --slip: #FFFFFF; --ink: #1B1D22; --muted: #5F636B; --rule: #DADBD6;
  --pencil: #2350C8; --pencil-wash: #E8EEFC; --redline: #B4232A; --red-wash: #FBEAEA;
  --keep: #2D6A3E; --keep-wash: #E7F2EA;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #15171B; --slip: #1D2025; --ink: #ECEDEF; --muted: #A2A6AE; --rule: #31353C;
  --pencil: #8EA9FF; --pencil-wash: #1F2944; --redline: #FF8A8F; --red-wash: #3A1D20;
  --keep: #7FD192; --keep-wash: #1B3123; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #15171B; --slip: #1D2025; --ink: #ECEDEF; --muted: #A2A6AE; --rule: #31353C;
  --pencil: #8EA9FF; --pencil-wash: #1F2944; --redline: #FF8A8F; --red-wash: #3A1D20;
  --keep: #7FD192; --keep-wash: #1B3123; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header h1 { font: 600 clamp(28px, 5vw, 40px)/1.1 var(--serif); margin: 0 0 6px; text-wrap: balance; }
header p { color: var(--muted); margin: 0; max-width: 62ch; }
.kicker { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper);
  border-bottom: 1px solid var(--rule); margin: 22px 0 18px; padding: 12px 0; display: flex; flex-direction: column; gap: 10px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.tally { display: flex; flex-wrap: wrap; gap: 14px; align-items: baseline; font: 13px var(--mono); font-variant-numeric: tabular-nums; }
.tally b { font-weight: 500; }
.t-keep { color: var(--keep); } .t-cut { color: var(--redline); } .t-rw { color: var(--pencil); }
.meter { height: 4px; background: var(--rule); display: flex; overflow: hidden; }
.meter i { display: block; height: 100%; }
.tabs, .filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs button, .filters button { flex: none; font: 500 12px var(--sans); border: 1px solid var(--rule); background: var(--slip);
  color: var(--ink); padding: 6px 10px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-pressed="true"], .filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tabs button .n { font-family: var(--mono); opacity: .7; margin-left: 4px; }
.status { font: 12px var(--mono); color: var(--muted); }
.status.warn { color: var(--redline); }
.group-note { color: var(--muted); font-size: 13px; margin: 0 0 12px; max-width: 70ch; }
.list { display: flex; flex-direction: column; gap: 10px; }
.slip { background: var(--slip); border: 1px solid var(--rule); border-left: 4px solid var(--rule); padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.slip[data-v="keep"] { border-left-color: var(--keep); }
.slip[data-v="cut"] { border-left-color: var(--redline); }
.slip[data-v="rewrite"] { border-left-color: var(--pencil); }
.slip-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.label { font: 600 17px/1.3 var(--serif); }
.sev { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; }
.field { display: grid; gap: 2px; min-width: 0; }
.field .k { font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.field .v { font: 400 17px/1.45 var(--serif); overflow-wrap: anywhere; }
.slip[data-v="cut"] .field .v { text-decoration: line-through; text-decoration-color: var(--redline); color: var(--muted); }
.field .new { font: 400 17px/1.45 var(--serif); color: var(--pencil); background: var(--pencil-wash); padding: 2px 6px; overflow-wrap: anywhere; }
textarea { width: 100%; font: 16px/1.45 var(--serif); color: var(--ink); background: var(--paper); border: 1px solid var(--pencil); padding: 8px; border-radius: 2px; resize: vertical; min-height: 60px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.actions button { font: 500 13px var(--sans); padding: 6px 12px; border-radius: 3px; cursor: pointer; border: 1px solid var(--rule); background: var(--slip); color: var(--ink); }
.actions .b-keep[aria-pressed="true"] { background: var(--keep-wash); border-color: var(--keep); color: var(--keep); }
.actions .b-cut[aria-pressed="true"] { background: var(--red-wash); border-color: var(--redline); color: var(--redline); }
.actions .b-rw[aria-pressed="true"] { background: var(--pencil-wash); border-color: var(--pencil); color: var(--pencil); }
.actions .save { background: var(--pencil); color: var(--slip); border-color: var(--pencil); }
.actions .file { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
.note { font-size: 13px; color: var(--muted); font-style: italic; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--pencil); outline-offset: 2px; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
@media (prefers-reduced-motion: no-preference) { .slip { transition: border-color .15s; } }
</style>

 it fake).","keepCutOnly":true,"file":"src/corpus/build-corpus.py EXCLUDE"},{"id":"ex:rigor / academic excellence:0","group":"Mirror example quotes","label":"Rigor and academic excellence","fields":{"quote":"It's hard work, and it's personal."},"note":"Real quote from your T0 corpus. Keep or cut only (rewriting would make it fake).","keepCutOnly":true,"file":"src/corpus/build-corpus.py EXCLUDE"},{"id":"ex:rigor / academic excellence:1","group":"Mirror example quotes","label":"Rigor and academic excellence","fields":{"quote":"We take you seriously as scholars and as thinkers."},"note":"Real quote from your T0 corpus. Keep or cut only (rewriting would make it fake).","keepCutOnly":true,"file":"src/corpus/build-corpus.py EXCLUDE"},{"id":"diag:AVERAGE","group":"Diagnosis lines (as generated)","label":"Average admissions copy","fields":{"line":"You lead with personal attention, like 14% of the schools we read, and we could not find a detail only you could write: 2 of 5 sentences would survive a logo swap."},"note":"Generated from a template. Rewrite to show the voice you want; the engine lane will adjust the template.","file":"src/engine/insight.js"},{"id":"diag:GENERIC","group":"Diagnosis lines (as generated)","label":"Bland sample","fields":{"line":"You lead with career outcomes, like 39% of the schools we read, and we could not find anything after it that is only yours: every sentence would survive a logo swap."},"note":"Generated from a template. Rewrite to show the voice you want; the engine lane will adjust the template.","file":"src/engine/insight.js"},{"id":"diag:MIXED","group":"Diagnosis lines (as generated)","label":"Mixed sample","fields":{"line":"You lead with career outcomes, like 39% of the schools we read, and your best detail, the Competitive Pierogi Society, is stuck in sentence 2 behind “vibrant community”."},"note":"Generated from a template. Rewrite to show the voice you want; the engine lane will adjust the template.","file":"src/engine/insight.js"}, <script>
(function () {
  const ITEMS = JSON.parse(document.getElementById('items').textContent);
  const GROUPS = ['Diagnosis lines (as generated)', 'Cliché translations', 'Band verdicts', 'Poster titles', 'Poster jokes', 'Mirror example quotes'];
  const NOTES = {
    'Diagnosis lines (as generated)': 'The headline sentence each sample gets. These come from templates, so a rewrite here tells the engine what voice you want, not just this one line.',
    'Cliché translations': 'What each cliché actually says, and the fix. This is the core IP. Severity: 3 is terminal.',
    'Band verdicts': 'The one-liner under the score for each band.',
    'Poster titles': 'Horror-film puns for the poster, with taglines.',
    'Poster jokes': 'Rating box, billing lines and footers on the downloadable poster.',
    'Mirror example quotes': 'Real lead-promise quotes from your 150-school corpus, shown with no school name. Cut anything identifiable, off-message or not generic enough to make the point.',
  };
  const FIELD_LABEL = { translation: 'What it actually says', fix: 'The fix', tagline: 'Tagline', verdict: 'Verdict', text: 'Line', quote: 'Quote', line: 'Diagnosis' };
  const key = (id) => id.replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 120) + '_' + Array.from(id).reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7).toString(36);
  const state = {}; // itemKey -> {verdict, fields, note}
  let group = GROUPS[0], filter = 'open', db = null, editing = null;
  const $ = (id) => document.getElementById(id);
  const statusEl = $('status');
  const setStatus = (t, warn) => { statusEl.textContent = t; statusEl.classList.toggle('warn', !!warn); };

  function counts(items) {
    const c = { keep: 0, cut: 0, rewrite: 0 };
    for (const it of items) { const v = state[key(it.id)]?.verdict; if (v) c[v]++; }
    return c;
  }
  function renderBar() {
    const c = counts(ITEMS), n = ITEMS.length, done = c.keep + c.cut + c.rewrite;
    $('tally').innerHTML = '';
    const parts = [[`${done} of ${n} decided`, ''], [`${c.keep} kept`, 't-keep'], [`${c.cut} cut`, 't-cut'], [`${c.rewrite} rewritten`, 't-rw']];
    for (const [t, cls] of parts) { const b = document.createElement('b'); b.textContent = t; if (cls) b.className = cls; $('tally').appendChild(b); }
    const m = $('meter').children;
    m[0].style.cssText = `width:${100 * c.keep / n}%;background:var(--keep)`;
    m[1].style.cssText = `width:${100 * c.cut / n}%;background:var(--redline)`;
    m[2].style.cssText = `width:${100 * c.rewrite / n}%;background:var(--pencil)`;
    const tabs = $('tabs'); tabs.innerHTML = '';
    for (const g of GROUPS) {
      const its = ITEMS.filter(i => i.group === g), cc = counts(its), left = its.length - cc.keep - cc.cut - cc.rewrite;
      const b = document.createElement('button');
      b.setAttribute('aria-pressed', String(g === group));
      b.textContent = g.replace(' (as generated)', '');
      const s = document.createElement('span'); s.className = 'n'; s.textContent = left ? `${left} left` : 'done'; b.appendChild(s);
      b.onclick = () => { group = g; editing = null; render(); };
      tabs.appendChild(b);
    }
  }

  async function save(it, patch) {
    const k = key(it.id);
    const prev = state[k] || {};
    const next = { ...prev, ...patch, itemId: it.id, group: it.group, label: it.label, file: it.file, original: it.fields, updatedAt: new Date().toISOString() };
    state[k] = next;
    render();
    if (!db) { setStatus('Not saving: this view has no storage. Open the page signed in to claude.ai.', true); return; }
    try { await db.collection('decisions').doc(k).set(next); setStatus('Saved.'); }
    catch (e) { setStatus(`Could not save (${e?.code || 'error'}). Your choice shows here but is not stored yet.`, true); }
  }
  async function clear(it) {
    const k = key(it.id); delete state[k]; render();
    if (db) { try { await db.collection('decisions').doc(k).delete(); setStatus('Cleared.'); } catch (e) { setStatus(`Could not clear (${e?.code || 'error'}).`, true); } }
  }

  function slip(it) {
    const k = key(it.id), d = state[k], v = d?.verdict || '';
    const el = document.createElement('article'); el.className = 'slip'; el.dataset.v = v;
    const top = document.createElement('div'); top.className = 'slip-top';
    const lab = document.createElement('div'); lab.className = 'label'; lab.textContent = it.label; top.appendChild(lab);
    if (it.severity) { const s = document.createElement('div'); s.className = 'sev'; s.textContent = `SEVERITY ${it.severity} OF 3`; top.appendChild(s); }
    el.appendChild(top);
    const isEditing = editing === k;
    for (const [f, val] of Object.entries(it.fields)) {
      const fw = document.createElement('div'); fw.className = 'field';
      const kk = document.createElement('div'); kk.className = 'k'; kk.textContent = FIELD_LABEL[f] || f; fw.appendChild(kk);
      const vv = document.createElement('div'); vv.className = 'v'; vv.textContent = val; fw.appendChild(vv);
      if (isEditing) {
        const ta = document.createElement('textarea'); ta.id = `ta-${k}-${f}`; ta.dataset.f = f;
        ta.value = d?.fields?.[f] ?? val; ta.setAttribute('aria-label', `Rewrite: ${FIELD_LABEL[f] || f}`);
        fw.appendChild(ta);
      } else if (v === 'rewrite' && d.fields && d.fields[f] !== undefined && d.fields[f] !== val) {
        const nw = document.createElement('div'); nw.className = 'new'; nw.textContent = d.fields[f]; fw.appendChild(nw);
      }
      el.appendChild(fw);
    }
    if (it.note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = it.note; el.appendChild(n); }
    if (isEditing) {
      const nf = document.createElement('div'); nf.className = 'field';
      const nk = document.createElement('div'); nk.className = 'k'; nk.textContent = 'Note for Claude (optional)'; nf.appendChild(nk);
      const nt = document.createElement('textarea'); nt.id = `note-${k}`; nt.value = d?.note || ''; nt.style.minHeight = '40px'; nt.setAttribute('aria-label', 'Note for Claude'); nf.appendChild(nt);
      el.appendChild(nf);
    }
    const acts = document.createElement('div'); acts.className = 'actions';
    const btn = (label, cls, pressed, fn) => { const b = document.createElement('button'); b.textContent = label; b.className = cls; if (pressed !== null) b.setAttribute('aria-pressed', String(pressed)); b.onclick = fn; acts.appendChild(b); return b; };
    if (isEditing) {
      btn('Save rewrite', 'save', null, () => {
        const fields = {}; el.querySelectorAll('textarea[data-f]').forEach(t => fields[t.dataset.f] = t.value.trim());
        editing = null; save(it, { verdict: 'rewrite', fields, note: el.querySelector(`#note-${CSS.escape(k)}`)?.value.trim() || '' });
      });
      btn('Cancel', '', null, () => { editing = null; render(); });
    } else {
      btn('Keep', 'b-keep', v === 'keep', () => v === 'keep' ? clear(it) : save(it, { verdict: 'keep', fields: null }));
      btn('Cut', 'b-cut', v === 'cut', () => v === 'cut' ? clear(it) : save(it, { verdict: 'cut', fields: null }));
      if (!it.keepCutOnly) btn(v === 'rewrite' ? 'Edit rewrite' : 'Rewrite', 'b-rw', v === 'rewrite', () => { editing = k; render(); setTimeout(() => el.querySelector('textarea')?.focus(), 0); });
    }
    const file = document.createElement('span'); file.className = 'file'; file.textContent = it.file; acts.appendChild(file);
    el.appendChild(acts);
    return el;
  }

  function render() {
    renderBar();
    document.querySelectorAll('#filters button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === filter)));
    $('groupNote').textContent = NOTES[group] || '';
    const list = $('list'); list.innerHTML = '';
    const its = ITEMS.filter(i => i.group === group).filter(i => {
      const v = state[key(i.id)]?.verdict, k = key(i.id);
      if (k === editing) return true;
      if (filter === 'open') return !v; if (filter === 'all') return true; return v === filter;
    });
    if (!its.length) {
      const e = document.createElement('div'); e.className = 'empty';
      e.textContent = filter === 'open' ? 'Nothing left to decide in this section.' : 'Nothing here yet.';
      list.appendChild(e); return;
    }
    for (const it of its) list.appendChild(slip(it));
  }
  document.querySelectorAll('#filters button').forEach(b => b.onclick = () => { filter = b.dataset.f; editing = null; render(); });

  render();
  const timer = setTimeout(() => setStatus('Saved decisions did not load. You can still review; choices may not be stored.', true), 10000);
  (async () => {
    try { db = window.claude ? await window.claude.use('db') : null; } catch { db = null; }
    if (!db) { clearTimeout(timer); setStatus('Not saving: this view has no storage. Open the page signed in to claude.ai.', true); return; }
    db.collection('decisions').onSnapshot(snap => {
      clearTimeout(timer);
      for (const d of snap.docs) { const x = d.data(); if (x) state[d.id] = x; }
      for (const ch of snap.docChanges()) if (ch.type === 'removed') delete state[ch.doc.id];
      if (!editing) render(); else renderBar();
      setStatus(`Saved decisions loaded (${snap.size}).`);
    }, e => { clearTimeout(timer); setStatus(`Could not load saved decisions (${e?.code || 'error'}).`, true); });
  })();
})();
</script>
